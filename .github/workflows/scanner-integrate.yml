name: Scanner vertical slice integration

on:
  push:
    branches:
      - scanner-vertical-slice
    paths:
      - bbb-scanner-core.js
      - bbb-scanner.js
      - tests/scanner-core.test.js
      - tests/browser-smoke.js
      - .github/workflows/scanner-integrate.yml

permissions:
  contents: write

jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: scanner-vertical-slice

      - name: Install the single authoritative rules source
        run: |
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/phshbone/billstestpage/main/bbb-rules-v1.5.1.json \
            --output bbb-rules.json
          node -e "const r=require('./bbb-rules.json'); if(r.version!=='1.5.1') throw new Error('Wrong rules version: '+r.version)"

      - name: Apply locked integration hooks
        shell: python
        run: |
          from pathlib import Path

          core = Path('bbb-scanner-core.js')
          text = core.read_text(encoding='utf-8')

          old = "const conditional=families.filter(h=>!isStructuralFamily(h)&&!isOnionPieces(h));"
          new = "const conditional=families.filter(h=>!isStructuralFamily(h)&&!isOnionPieces(h)&&!(preparedPotato&&h.id==='potato_skin_starch'));"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected scanner precedence anchor was not found; stop instead of silently patching the wrong code.')

          missing_guard = "else if(record.completeness.missing.length){general='hold';reason='Product facts are incomplete: '+record.completeness.missing.join(', ')+'.';evidence.push({kind:'incomplete data',label:'missing '+record.completeness.missing.join(', '),reason:'Incomplete product facts remain Hold On rather than being treated as clear permission.'});}"
          potato_anchor = "else if(preparedPotato){general='good';"
          if missing_guard not in text:
              if potato_anchor not in text:
                  raise SystemExit('Expected completeness/preparation anchor was not found; stop instead of changing verdict semantics silently.')
              text = text.replace(potato_anchor, missing_guard + "\n    " + potato_anchor, 1)
          core.write_text(text, encoding='utf-8')

          page = Path('index.html')
          html = page.read_text(encoding='utf-8')
          original_html = html

          # The legacy v2 camera has two automatic entry points: bottom-nav Scan and
          # the home/action Scan path. In the cohesive scanner build the barcode panel
          # is the primary Scan surface, so suppress only those automatic takeovers.
          # Explicit legacy OCR/photo controls (open-camera/new-camera-scan/etc.) remain.
          old_nav_auto = "if (btn.dataset.tab === 'scan') setTimeout(openCameraOverlay, 80);"
          guarded_nav_auto = "if (btn.dataset.tab === 'scan' && !document.querySelector('.bbb-scanner-panel')) setTimeout(openCameraOverlay, 80);"
          if old_nav_auto in html:
              html = html.replace(old_nav_auto, guarded_nav_auto, 1)
          elif guarded_nav_auto not in html:
              raise SystemExit('Legacy bottom-nav camera auto-open anchor changed; stop rather than patching unrelated code.')

          old_action_auto = "if (cameraOpeningFromScanTab) {"
          guarded_action_auto = "if (cameraOpeningFromScanTab && !document.querySelector('.bbb-scanner-panel')) {"
          if old_action_auto in html:
              html = html.replace(old_action_auto, guarded_action_auto, 1)
          elif guarded_action_auto not in html:
              raise SystemExit('Legacy action camera auto-open anchor changed; stop rather than patching unrelated code.')

          marker = '<!-- BBB_SCANNER_VERTICAL_SLICE -->'
          hook = '''\n<!-- BBB_SCANNER_VERTICAL_SLICE -->\n<script src="./bbb-scanner-core.js"></script>\n<script src="./bbb-scanner.js"></script>\n'''
          if marker not in html:
              if '</body>' not in html:
                  raise SystemExit('index.html has no closing body tag; LOCK must be reopened.')
              html = html.replace('</body>', hook + '</body>', 1)

          if html != original_html:
              page.write_text(html, encoding='utf-8')

      - name: Syntax checks
        run: |
          node --check bbb-scanner-core.js
          node --check bbb-scanner.js
          node --check tests/browser-smoke.js

      - name: Rules smoke tests
        run: node tests/scanner-core.test.js

      - name: Verify live product sources are reachable
        run: |
          curl --fail --silent --show-error --location \
            'https://world.openfoodfacts.org/api/v2/product/3017620422003.json?fields=product_name,ingredients_text,nutriments,serving_size' \
            --output /tmp/off.json
          node -e "const d=require('/tmp/off.json'); if(d.status!==1) throw new Error('Known OFF product was not found')"
          curl --fail --silent --show-error --location \
            'https://bad-belly-usda.phshbone.workers.dev/search?query=3017620422003&pageSize=1&mode=all' \
            --output /tmp/usda.json
          node -e "const d=require('/tmp/usda.json'); if(d.ok!==true) throw new Error('Protected USDA Worker did not return ok=true')"

      - name: Install browser smoke runner
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Mobile and desktop browser smoke tests
        run: |
          python3 -m http.server 4173 >/tmp/bbb-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          node tests/browser-smoke.js

      - name: Verify integration invariants
        run: |
          test "$(grep -c 'BBB_SCANNER_VERTICAL_SLICE' index.html)" -eq 1
          test "$(grep -c 'bbb-scanner-core.js' index.html)" -eq 1
          test "$(grep -c 'bbb-scanner.js' index.html)" -eq 1
          test "$(grep -c "cameraOpeningFromScanTab && !document.querySelector('.bbb-scanner-panel')" index.html)" -eq 1
          test "$(grep -c "btn.dataset.tab === 'scan' && !document.querySelector('.bbb-scanner-panel')" index.html)" -eq 1
          test "$(node -p "require('./bbb-rules.json').version")" = "1.5.1"
          ! grep -q 'bbb-rules-v1.5.1.json' index.html
          ! grep -q 'bbb-rules.json' index.html

      - name: Commit validated branch integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html bbb-rules.json bbb-scanner-core.js
          if git diff --cached --quiet; then
            echo 'No generated integration changes to commit.'
            exit 0
          fi
          git commit -m 'Integrate validated scanner vertical slice'
          git push origin scanner-vertical-slice
