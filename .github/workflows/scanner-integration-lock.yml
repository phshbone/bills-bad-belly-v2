name: Scanner Integration Lock

on:
  push:
    branches:
      - scanner-integration-lock

permissions:
  contents: write

jobs:
  smoke-and-wire:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout locked branch
        uses: actions/checkout@v4
        with:
          ref: scanner-integration-lock
          fetch-depth: 0

      - name: Syntax checks
        run: |
          node --check bbb-scanner-engine.js
          node --check bbb-v2-scanner-adapter.js

      - name: Locked rules smoke tests
        run: node tests/scanner-engine-smoke.test.js

      - name: Retrieval and cache smoke tests
        run: node tests/product-retrieval-smoke.test.js

      - name: Wire scanner scripts into v2 index
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          sentinel = 'bbb-v2-scanner-adapter.js'
          if sentinel not in text:
              snippet = '''\n<!-- LOCKED scanner integration v1.5.2 -->\n<script src="https://unpkg.com/@zxing/browser@latest"></script>\n<script src="./bbb-scanner-engine.js"></script>\n<script src="./bbb-v2-scanner-adapter.js"></script>\n'''
              if '</body>' not in text:
                  raise SystemExit('index.html has no closing body tag')
              text = text.replace('</body>', snippet + '</body>', 1)
              p.write_text(text, encoding='utf-8')
              print('wired scanner integration')
          else:
              print('scanner integration already wired')
          PY

      - name: Verify one authoritative rules load path
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html').read_text(encoding='utf-8')
          adapter = Path('bbb-v2-scanner-adapter.js').read_text(encoding='utf-8')
          assert 'bbb-rules-v1.5.2.json' in adapter
          assert 'bbb-rules.json' not in adapter
          assert index.count('bbb-v2-scanner-adapter.js') == 1
          print('PASS: v2 adapter points only to rules v1.5.2')
          PY

      - name: Package isolated branch for browser smoke test
        uses: actions/upload-artifact@v4
        with:
          name: scanner-integration-lock-build
          path: |
            index.html
            bbb header-transparent.png
            bbb-rules-v1.5.2.json
            bbb-scanner-engine.js
            bbb-v2-scanner-adapter.js
            tests/
          if-no-files-found: error

      - name: Commit branch wiring if changed
        run: |
          if git diff --quiet -- index.html; then
            echo "No wiring change needed"
            exit 0
          fi
          git config user.name "bbb-scanner-build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Wire locked scanner integration into v2"
          git push origin HEAD:scanner-integration-lock
